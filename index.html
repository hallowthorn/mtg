<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deckforge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a game client — top bar with modes; Build = card collection + deck binder; Play = full playmat. */
:root{
  --bg:#0b1018; --felt:#13202b; --panel:#141d29; --panel2:#1c2836; --line:#2b3a4d;
  --fg:#ece6d8; --muted:#8e9bad; --gold:#d9a94e; --gold2:#f3d48a; --gold-ink:#1c1305;
  --good:#6fcf7a; --bad:#ec6b6b; --warn:#e9ad45;
  --mW:#f2e8c6; --mU:#4f93dc; --mB:#a693b0; --mR:#e3633f; --mG:#4fad6c; --mC:#bdb8ab;
  --display:"Cinzel",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --cw:150px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(180deg,#18222f,#0f1620);border-bottom:1px solid #3a2f1a;box-shadow:0 2px 0 #000,0 1px 0 rgba(217,169,78,.25) inset;flex-wrap:wrap;position:relative;z-index:30}
.brand{font:900 21px var(--display);letter-spacing:.08em;margin:0;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;gap:9px;align-items:center}
.brand svg{width:26px;height:26px;color:var(--gold)}
.modes{display:flex;gap:2px;background:#0a0f16;border:1px solid var(--line);border-radius:10px;padding:3px}
.mode{border:0;background:none;padding:7px 16px;border-radius:7px;font:700 12px var(--display);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.mode.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);box-shadow:0 0 14px rgba(217,169,78,.35)}
.deckctl{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.btn.sm{padding:3px 9px;font-size:12px}
select,input[type=text],input[type=number],input[type=search],textarea{background:#0e151e;border:1px solid var(--line);border-radius:7px;padding:6px 9px}
input[type=number]{width:62px}

.view{flex:1;min-height:0}

/* ---------- build view ---------- */
#v-build{display:grid;grid-template-columns:minmax(0,1fr) 360px}
@media (max-width:900px){#v-build{grid-template-columns:1fr;overflow:auto}}
.collection{display:flex;flex-direction:column;min-height:0;background:radial-gradient(ellipse at 50% -20%,#1d2c3d,transparent 60%),var(--bg)}
.searchbar{display:flex;flex-direction:column;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0;font-size:15px;padding:9px 13px;border-radius:9px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.mana-f{display:flex;gap:5px}
.mana-f button{width:30px;height:30px;border-radius:50%;border:2px solid #000;font:700 12px var(--mono);color:#111;opacity:.35;transition:opacity .15s,transform .15s;box-shadow:0 2px 0 #000}
.mana-f button.on{opacity:1;transform:translateY(-2px);box-shadow:0 0 10px currentColor}
.subtabs{display:flex;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.subtab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 2px;color:var(--muted);font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase}
.subtab.on{color:var(--gold2);border-color:var(--gold)}
.scroll{flex:1;overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:18px 14px;padding:16px}
.gcard{position:relative;perspective:800px}
.gcard .face{position:relative;border-radius:4.75%/3.5%;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 4px 12px rgba(0,0,0,.55);aspect-ratio:488/680;background:#0e151e}
.gcard .face img{width:100%;height:100%;display:block;object-fit:cover}
.gcard:hover .face{transform:translateY(-6px) rotateX(6deg) scale(1.03);box-shadow:0 14px 26px rgba(0,0,0,.6),0 0 0 2px var(--gold),0 0 22px rgba(217,169,78,.45)}
.gcard .face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.gcard:hover .face::after{transform:translateX(120%)}
.gcard .under{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);gap:6px}
.gcard .addside{background:none;border:1px solid var(--line);border-radius:5px;font-size:11px;padding:1px 6px;color:var(--muted)}
.gcard .addside:hover{color:var(--gold2);border-color:var(--gold)}
.badge{position:absolute;top:-7px;right:-7px;z-index:2;min-width:28px;height:28px;border-radius:14px;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 60%,#8a6420);color:var(--gold-ink);font:700 13px var(--mono);display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px #000;border:2px solid #2a1e08}
.badge.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.4)}}
/* legality labels */
.ribbon{position:absolute;left:-12%;right:-12%;top:36%;z-index:3;transform:rotate(-14deg);background:linear-gradient(180deg,#d8352a,#8f1710);color:#fff;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:5px 4px;box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.25) inset;pointer-events:none;text-shadow:0 1px 2px #000}
.ribbon.warn{background:linear-gradient(180deg,#e9ad45,#a46d10);color:#1c1305;text-shadow:none}
.illegal img{filter:grayscale(.65) brightness(.62)}
.ltag{position:relative;z-index:1;flex:none;font:700 9px var(--body);letter-spacing:.1em;padding:2px 6px;border-radius:4px;margin-right:6px;background:#b3261e;color:#fff;box-shadow:0 1px 3px #000}
.ltag.warn{background:var(--warn);color:#1c1305}
.pc .dfc{position:absolute;right:4px;bottom:4px;z-index:2;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.75);color:var(--gold2);font-size:11px;border:1px solid var(--gold);pointer-events:none}
#z-hand .pc .dfc{bottom:auto;top:4px}
.pc .ltag{position:absolute;left:4px;top:4px;margin:0;font-size:8px;padding:1px 4px;z-index:2}
.legalbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13px}
.legalbar.bad{background:rgba(216,53,42,.15);border:1px solid #d8352a;color:#ffb3ab}
.legalbar.warn{background:rgba(233,173,69,.12);border:1px solid var(--warn);color:var(--gold2)}
.legalbar.ok{background:rgba(111,207,122,.1);border:1px solid rgba(111,207,122,.5);color:var(--good)}
.legal .b{color:#ff8a80;font-weight:600}.legal .r{color:var(--warn)}
/* preset gallery */
.gal-tabs{display:flex;gap:4px;flex-wrap:wrap}
.gal-tabs button{border:1px solid var(--line);background:#0e151e;border-radius:999px;padding:5px 14px;font:700 11px var(--display);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.gal-tabs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ptile{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e151e;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;padding:0}
.ptile:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 18px rgba(217,169,78,.3)}
.ptile .pa{height:112px;background:#18222f center 25%/cover no-repeat;position:relative}
.ptile .pa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0e151e)}
.ptile .rank{position:absolute;top:8px;left:8px;z-index:1;font:700 12px var(--mono);background:rgba(0,0,0,.75);color:var(--gold2);border:1px solid var(--gold);border-radius:6px;padding:1px 7px}
.ptile .loaded{position:absolute;top:8px;right:8px;z-index:1;font:700 10px var(--body);letter-spacing:.08em;background:var(--good);color:#06210b;border-radius:5px;padding:2px 6px}
.ptile .pb{padding:4px 12px 12px;display:flex;flex-direction:column;gap:5px}
.ptile h4{margin:0;font:700 15px var(--display);letter-spacing:.03em;color:var(--fg)}
.ptile .share{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--gold2)}
.ptile .share i{flex:1;height:5px;background:#1c2836;border-radius:3px;overflow:hidden;position:relative}
.ptile .share i b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px}
.ptile small{color:var(--muted);font-size:11.5px;line-height:1.35}
.ptile.busy{pointer-events:none;opacity:.7}
.ptile.busy .pa::before{content:"Loading cards…";position:absolute;inset:0;z-index:2;display:grid;place-items:center;font:700 12px var(--display);letter-spacing:.1em;color:var(--gold2);background:rgba(0,0,0,.55)}
.srcline{font-size:11.5px;color:var(--muted);line-height:1.35}
.srcline b{color:var(--gold2);font-weight:600}
.empty{padding:40px 20px;color:var(--muted);text-align:center;grid-column:1/-1}
.empty b{display:block;font:700 18px var(--display);color:var(--fg);margin-bottom:6px;letter-spacing:.05em}
.pager{display:flex;justify-content:center;gap:12px;padding:0 16px 18px;align-items:center;color:var(--muted);font-size:13px}
.err{margin:16px;padding:14px 16px;border:1px solid var(--bad);border-radius:10px;background:rgba(236,107,107,.08)}

/* visual deck view (stacks by mana value) */
.stacks{display:flex;gap:14px;padding:18px 16px;align-items:flex-start;overflow-x:auto}
.stack{flex:0 0 136px;display:flex;flex-direction:column}
.stack h4{margin:0 0 8px;font:700 11px var(--display);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:center}
.stack .sc{position:relative;margin-top:-152px;transition:transform .15s;cursor:pointer}
.stack .sc:first-of-type{margin-top:0}
.stack .sc img{width:136px;border-radius:7px;display:block;box-shadow:0 -3px 8px rgba(0,0,0,.5)}
.stack .sc:hover{transform:translateX(10px);z-index:5}
.stack .sc .q{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:var(--gold2);font:600 11px var(--mono);border-radius:9px;padding:1px 7px}

/* ---------- deck binder (sidebar) ---------- */
.binder{background:linear-gradient(180deg,#151f2b,#101822);border-left:1px solid #3a2f1a;display:flex;flex-direction:column;min-height:0;box-shadow:-6px 0 18px rgba(0,0,0,.4)}
.binder-h{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.binder-h input{font:700 16px var(--display);letter-spacing:.04em;background:transparent;border:1px solid transparent;padding:3px 6px;margin:0 -6px}
.binder-h input:hover,.binder-h input:focus{border-color:var(--line);background:#0e151e}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font:500 13px var(--mono)}
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;border:1px solid;letter-spacing:.03em}
.pill.ok{color:var(--good);border-color:rgba(111,207,122,.5);background:rgba(111,207,122,.08)}
.pill.no{color:var(--bad);border-color:rgba(236,107,107,.5);background:rgba(236,107,107,.08);cursor:pointer}
.cmdslot{margin:10px 14px 0;border-radius:10px;overflow:hidden;position:relative;height:96px;border:1px solid var(--gold);box-shadow:0 0 16px rgba(217,169,78,.25);background:#0e151e center/cover}
.cmdslot .lbl{position:absolute;inset:auto 0 0;padding:20px 10px 7px;background:linear-gradient(transparent,rgba(0,0,0,.9));font:700 13px var(--display);letter-spacing:.05em}
.cmdslot .lbl small{display:block;font:600 9px var(--body);letter-spacing:.18em;color:var(--gold2)}
.cmdslot.emptyslot{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-size:12px;box-shadow:none;border-color:var(--line)}
.dlist{flex:1;overflow:auto;padding:6px 10px 14px;min-height:0}
.dgroup h3{margin:12px 4px 5px;font:700 10px var(--display);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.strip{position:relative;height:38px;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;overflow:hidden;background:#0e151e;border:1px solid rgba(0,0,0,.6);cursor:pointer;transition:transform .12s,border-color .12s}
.strip:hover{transform:translateX(-3px);border-color:var(--gold)}
.strip .art{position:absolute;inset:0 0 0 30%;background:center 30%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.strip .q{position:relative;z-index:1;width:30px;height:100%;display:grid;place-items:center;background:rgba(0,0,0,.55);font:600 13px var(--mono);color:var(--gold2);flex:none}
.strip .n{position:relative;z-index:1;padding-left:9px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px;text-shadow:0 1px 3px #000,0 0 6px #000}
.strip .c{position:relative;z-index:1;padding-right:7px;display:flex;gap:2px}
.strip.bad{border-color:var(--bad)}
.strip.bad .n{color:#ffb3b3}
.strip .tools{position:absolute;right:0;top:0;bottom:0;z-index:2;display:none;align-items:center;gap:3px;padding:0 6px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.9) 25%)}
.strip:hover .tools{display:flex}
.strip .tools button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:#0e151e;font-size:13px;padding:0;line-height:1}
.strip .tools button:hover{border-color:var(--gold);color:var(--gold2)}
.pip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font:700 9px var(--mono);color:#111;background:var(--mC);box-shadow:0 1px 0 #000}
.pip.W{background:var(--mW)}.pip.U{background:var(--mU)}.pip.B{background:var(--mB)}.pip.R{background:var(--mR)}.pip.G{background:var(--mG)}
.minicurve{display:flex;gap:3px;align-items:flex-end;height:34px}
.minicurve i{flex:1;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:2px 2px 0 0;min-height:2px;position:relative}
.binder-f{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.binder-f .labels{display:flex;gap:3px;font:10px var(--mono);color:var(--muted)}.binder-f .labels span{flex:1;text-align:center}

/* ---------- stats & odds views ---------- */
.page{overflow:auto;padding:22px max(16px,4vw)}
.page-inner{max-width:980px;margin:0 auto;display:grid;gap:18px}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card-panel h2{margin:0 0 12px;font:700 13px var(--display);letter-spacing:.14em;color:var(--gold2);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--panel2);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.tile .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:500 26px var(--mono)}
.curve{display:flex;align-items:flex-end;gap:10px;height:170px;border-bottom:1px solid var(--line);padding-top:18px}
.curve .bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.curve .bar i{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,#7b5a1d);min-height:2px;transition:height .5s}
.curve .bar b{font:500 12px var(--mono);margin-bottom:4px}
.curvelab{display:flex;gap:10px}.curvelab span{flex:1;text-align:center;font:12px var(--mono);color:var(--muted);padding-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:700px){.two{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:100px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;margin-bottom:7px}
.hbar .t{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}.hbar .t i{display:block;height:100%;border-radius:6px}
.oddsform{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px;margin-bottom:16px}
.oddsform label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.bigodds{font:500 54px var(--mono);color:var(--gold2);text-shadow:0 0 22px rgba(217,169,78,.35)}
table.odds{width:100%;border-collapse:collapse;font-size:13px}
table.odds th,table.odds td{padding:7px;border-bottom:1px solid var(--line);text-align:right}
table.odds th:first-child,table.odds td:first-child{text-align:left}
table.odds th{color:var(--muted);font-weight:500}
.issues li{margin-bottom:4px}

/* ---------- play view (playmat) ---------- */
#v-play{display:flex;flex-direction:column;background:
  radial-gradient(ellipse at 50% 45%,rgba(64,110,140,.22),transparent 65%),
  repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),
  linear-gradient(180deg,#132634,#0c1822);position:relative;overflow:hidden}
.hud{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(217,169,78,.2)}
.hud .grp{display:flex;gap:6px;align-items:center}
.lifeorb{display:flex;align-items:center;gap:6px;margin-left:auto}
.lifeorb .orb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--mono);background:radial-gradient(circle at 35% 30%,#ff9a7a,#b3301c 60%,#4a0d05);box-shadow:0 0 18px rgba(227,99,63,.55),inset 0 -4px 8px rgba(0,0,0,.5);border:2px solid #f3d48a;color:#fff;text-shadow:0 1px 2px #000}
.lifeorb button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.turnbadge{font:700 12px var(--display);letter-spacing:.14em;color:var(--gold2);padding:0 8px}
.table{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 196px;grid-template-rows:minmax(0,1fr) minmax(0,auto);gap:10px;padding:12px 16px 0;min-height:0}
.lanes{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.zone{border:1px solid rgba(217,169,78,.18);border-radius:12px;background:rgba(0,0,0,.18);position:relative;transition:background .15s,border-color .15s}
.zone.over{background:rgba(217,169,78,.12);border-color:var(--gold)}
.zone .zl{position:absolute;top:6px;left:10px;font:700 10px var(--display);letter-spacing:.18em;color:rgba(236,230,216,.35);text-transform:uppercase;pointer-events:none}
.zone .zcards{display:flex;flex-wrap:wrap;gap:10px;padding:24px 12px 12px;min-height:150px;align-content:flex-start}
#z-bf{flex:1}
.side{display:grid;grid-template-columns:1fr 1fr;gap:26px 12px;align-content:start;padding-top:8px}
.pile{border-radius:10px;border:1px dashed rgba(217,169,78,.3);aspect-ratio:488/680;position:relative;display:grid;place-items:center;cursor:pointer;background:rgba(0,0,0,.2)}
.pile .plbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:700 9px var(--display);letter-spacing:.16em;color:var(--muted)}
.pile .pc{position:absolute;inset:0;width:100%!important}
.pile .cnt{position:absolute;top:-8px;right:-8px;z-index:3}
.cardback{width:100%;height:100%;border-radius:6%/4.4%;background:
  radial-gradient(ellipse 34% 40% at 50% 50%,#c8873a 0 30%,#6b3a17 31% 46%,transparent 47%),
  radial-gradient(ellipse 60% 70% at 50% 50%,#3a2412,#1c120a);border:4px solid #241509;box-shadow:inset 0 0 0 2px #7a5228,0 3px 0 #000,0 6px 12px rgba(0,0,0,.6);position:relative}

<script>
"use strict";
/* ================= Scryfall API ================= */
const API = "https://api.scryfall.com";
let lastCall = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* Scryfall asks for gentle traffic: requests are spaced out, and a dropped connection,
   "too many requests" (429) or a server hiccup is retried a few times before giving up. */
async function api(path, opts = {}) {
  let lastErr = null;
  const BACKOFF = [600, 1600];
  for (let attempt = 0; attempt <= BACKOFF.length; attempt++) {
    if (attempt && lastErr) await sleep(Math.max(lastErr.retryAfter || 0, BACKOFF[attempt - 1]));
    const wait = Math.max(0, lastCall + 120 - Date.now());
    lastCall = Date.now() + wait;
    if (wait) await sleep(wait);
    let res;
    try {
      res = await fetch(path.startsWith("http") ? path : API + path, {
        method: opts.method || "GET", body: opts.body,
        headers: opts.body ? { "Content-Type": "application/json" } : undefined
      });
    } catch (e) { lastErr = Object.assign(new Error("No response from Scryfall"), { kind: "network" }); continue; }
    if (res.status === 429 || res.status >= 500) {
      lastErr = Object.assign(new Error(`Scryfall answered ${res.status}`), { kind: res.status === 429 ? "rate" : "server", retryAfter: Math.min(5000, (+res.headers.get("Retry-After") || 0) * 1000) });
      continue;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok && res.status !== 404 && res.status !== 400) throw Object.assign(new Error(data.details || ("Scryfall error " + res.status)), { kind: "server" });

/* ================= Card model ================= */

    colors: c.colors || (face && face.colors) || [], ci: c.color_identity || [],

  return "Other";
}

const EXTRA = { token: "Token", double_faced_token: "Token", emblem: "Emblem", planar: "Plane (Planechase)", scheme: "Scheme (Archenemy)", vanguard: "Vanguard", art_series: "Art card" };

  if (L === "restricted") return { kind: "warn", short: "RESTRICTED", long: `Restricted in ${FMT_NAME[fmt]} (1 copy)` };

}
const ribbon = t => t ? `<span class="ribbon ${t.kind}">${esc(t.long)}</span>` : "";
const ltag = t => t ? `<span class="ltag ${t.kind}" title="${esc(t.long)}">${esc(t.short)}</span>` : "";

/* ================= Storage ================= */
const LS = "deckforge.v1";
let state = { decks: [], current: null };

const deck = () => state.decks.find(d => d.id === state.current);

const isCmdr = f => f === "commander" || f === "brawl";

/* ================= Deck operations ================= */
const findE = (d, name, board) => d.entries.find(e => e.card.name === name && e.board === board);

function addCard(card, board = "main", fromEl) {
  const d = deck();
  if (board === "cmd") {
    d.entries.filter(e => e.board === "cmd").forEach(e => { e.board = "main"; });
    const ex = findE(d, card.name, "main"); if (ex) { ex.qty--; if (ex.qty <= 0) d.entries.splice(d.entries.indexOf(ex), 1); }
    d.entries.push({ card, qty: 1, board: "cmd" });
    toast(`${card.name} leads your deck`);
  } else {
    const e = findE(d, card.name, board);
    if (e) e.qty++; else d.entries.push({ card, qty: 1, board });
  }
  save(); if (fromEl) flyTo(fromEl, card.name); renderBuild(); renderMeta();
}
function changeQty(name, board, delta) {
  const d = deck(); const e = findE(d, name, board); if (!e) return;

}

  const t = findE(d, name, to); if (t) t.qty++; else d.entries.push({ card: e.card, qty: 1, board: to });

}

  const d = deck(); const e = findE(d, name, "cmd"); if (!e) return;
  d.entries.splice(d.entries.indexOf(e), 1);
  const m = findE(d, name, "main"); if (m) m.qty++; else d.entries.push({ card: e.card, qty: 1, board: "main" });

}

/* ================= Legality ================= */
function validate(d) {
  const probs = [], bad = new Set(); const f = d.format;

  const main = count(d, "main"), side = count(d, "side"), cmd = d.entries.filter(e => e.board === "cmd");
  if (isCmdr(f)) {
    const need = f === "brawl" ? 60 : 100;
    if (main + cmd.length !== need) probs.push(`Deck has ${main + cmd.length} cards with the commander; ${f} needs exactly ${need}.`);
    if (!cmd.length) probs.push("No commander yet. Hover a legendary creature in your deck and press ★.");
    const ident = new Set(cmd.flatMap(e => e.card.ci));
    if (cmd.length) d.entries.forEach(e => { if (e.board !== "cmd" && e.card.ci.some(c => !ident.has(c))) { bad.add(e.card.name); probs.push(`${e.card.name} is outside your commander's colors.`); } });
  } else {
    if (main < 60) probs.push(`Main deck has ${main} cards; you need at least 60.`);
    if (side > 15) probs.push(`Sideboard has ${side} cards; the maximum is 15.`);
  }
  const limit = isCmdr(f) ? 1 : 4; const seen = new Set();
  d.entries.forEach(e => {
    const L = e.card.legal && e.card.legal[f];
    if (L && L !== "legal" && L !== "restricted") { bad.add(e.card.name); probs.push(`${e.card.name} is ${L.replace("_", " ")} in ${f}.`); }
    const n = totalOf(d, e.card.name);
    if (!seen.has(e.card.name)) {
      seen.add(e.card.name);
      if (L === "restricted" && n > 1) { bad.add(e.card.name); probs.push(`${e.card.name} is restricted to one copy.`); }
      if (!isBasic(e.card) && n > limit) { bad.add(e.card.name); probs.push(`${n} copies of ${e.card.name}; the limit is ${limit}.`); }

  const target = document.querySelector(`.strip[data-name="${CSS.escape(name)}"]`) || $("#dlist");
  const t = target.getBoundingClientRect();

/* ================= Search ================= */

  if ($("#fType").value) q += ` t:"${$("#fType").value}"`;

  if ($("#fId").checked && isCmdr(d.format)) { const c = d.entries.find(e => e.board === "cmd"); if (c) q += ` id<=${c.card.ci.join("").toLowerCase() || "c"}`; }

  }

    results = data.data.map(slim); nextPage = data.has_more ? data.next_page : null;

  }

/* ================= Odds ================= */

    </div>

        <div class="tile"><div class="k">Avg lands in 7</div><div class="v">${(landSum / sims).toFixed(2)}</div></div>

/* ================= Import / Export ================= */
function parseList(text) {
  const out = []; let board = "main";
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trim(); if (!line) continue;
    if (/^\/\/|^#/.test(line)) { if (/side/i.test(line)) board = "side"; else if (/command/i.test(line)) board = "cmd"; continue; }
    if (/^(sideboard|side)\s*:?$/i.test(line)) { board = "side"; continue; }
    if (/^commander\s*:?$/i.test(line)) { board = "cmd"; continue; }
    if (/^(deck|main ?deck|mainboard|companion)\s*:?$/i.test(line)) { board = "main"; continue; }
    let b = board;
    if (/^SB:\s*/i.test(line)) { b = "side"; line = line.replace(/^SB:\s*/i, ""); }
    if (/\*CMDR\*/i.test(line)) { b = "cmd"; line = line.replace(/\*CMDR\*/i, ""); }
    const m = line.match(/^(\d+)\s*x?\s+(.+)$/i);
    let qty = 1, name = line; if (m) { qty = +m[1]; name = m[2]; }
    name = name.replace(/\s+\([A-Z0-9]{2,6}\)(\s+[\w-]+)?\s*$/i, "").replace(/\s+\*F\*$/i, "").trim();
    if (name) out.push({ qty, name, board: b });
  }
  return out;
}
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const front = s => String(s).split(/\s*\/\/?\s*/)[0];
async function importList(text, d) {
  const lines = parseList(text); const missing = []; const found = {};
  const unique = [...new Set(lines.map(l => norm(front(l.name))))];
  for (let i = 0; i < unique.length; i += 75) {
    const { data } = await api("/cards/collection", { method: "POST", body: JSON.stringify({ identifiers: unique.slice(i, i + 75).map(n => ({ name: n })) }) });
    (data.data || []).forEach(c => { const s = slim(c); found[norm(s.name)] = s; found[norm(front(s.name))] = s; });
    (data.not_found || []).forEach(n => missing.push(n.name));
  }
  // A name can match only the back face of a different card (e.g. "Exsanguinate" vs
  // "Stensian Sanguinist // Exsanguinate"). Look those up by exact name instead.
  const notFound = new Set(missing.map(norm));
  for (const n of [...new Set(lines.map(l => l.name))]) {
    if (found[norm(n)] || found[norm(front(n))] || notFound.has(norm(front(n)))) continue;
    const { status, data } = await api("/cards/named?exact=" + encodeURIComponent(n));
    if (status === 200 && data && data.name) { const s = slim(data); found[norm(n)] = s; found[norm(s.name)] = s; }
    else missing.push(n);
  }
  for (const l of lines) {
    const c = found[norm(l.name)] || found[norm(front(l.name))]; if (!c) continue;
    const e = d.entries.find(x => x.card.name === c.name && x.board === l.board);
    if (e) e.qty += l.qty; else d.entries.push({ card: c, qty: l.board === "cmd" ? 1 : l.qty, board: l.board });
  }
  return missing;
}

  <p style="margin:0;color:var(--muted);font-size:13px">Paste from Moxfield, MTGGoldfish, Arena or plain text, one card per line like “4 Lightning Bolt”. A line saying “Sideboard” or “Commander” starts that section.</p>
  <textarea id="impText" placeholder="4 Lightning Bolt&#10;20 Mountain&#10;&#10;Sideboard&#10;3 Pyroblast"></textarea>
  <label style="font-size:13px"><input type="checkbox" id="impNew" checked> Import as a new deck</label>
  <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn gold" id="doImp">Import</button></div>`, box => {
  box.querySelector("#doImp").onclick = async () => {

    const btn = box.querySelector("#doImp"); btn.disabled = true; btn.textContent = "Fetching cards…";
    const asNew = box.querySelector("#impNew").checked;

    } catch (e) { btn.disabled = false; btn.textContent = "Import"; toast(esc(netError(e)), 7000); }

function exportText(d) {
  const L = []; const cmd = d.entries.filter(e => e.board === "cmd");
  if (cmd.length) L.push("Commander", ...cmd.map(e => `1 ${e.card.name}`), "", "Deck");
  d.entries.filter(e => e.board === "main").forEach(e => L.push(`${e.qty} ${e.card.name}`));
  const side = d.entries.filter(e => e.board === "side"); if (side.length) L.push("", "Sideboard", ...side.map(e => `${e.qty} ${e.card.name}`));
  return L.join("\n");
}

  const txt = exportText(deck());
  modal(`<h3>Export “${esc(deck().name)}”</h3><textarea id="expText" readonly>${esc(txt)}</textarea><div class="acts"><button class="btn" data-close>Close</button><button class="btn" id="dl">Download .txt</button><button class="btn gold" id="cp">Copy</button></div>`, box => {

    box.querySelector("#dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" })); a.download = (deck().name || "deck").replace(/[^\w -]/g, "") + ".txt"; document.body.appendChild(a); a.click(); a.remove(); };

const artUrl = name => PRESET_ART[name] || "https://api.scryfall.com/cards/named?format=image&version=art_crop&exact=" + encodeURIComponent(name);

async function loadPreset(p) {
  const existing = state.decks.find(d => d.presetId === p.id);
  if (existing) { state.current = existing.id; pt = null; save(); renderAll(); setMode("build"); return existing; }
  const d = { id: uid(), name: p.name, format: p.fmt, entries: [], presetId: p.id,
    source: p.casual ? null : { fmt: p.fmt, rank: p.rank, meta: p.meta, ev: p.ev, date: p.date, pilot: p.pilot } };
  const miss = await importList(p.list, d);
  state.decks.push(d); state.current = d.id; pt = null; save(); renderAll(); setMode("build");
  if (results.length) renderResults();
  toast(miss.length ? `Loaded ${esc(p.name)}. Couldn't find: ${esc(miss.join(", "))}` : `Loaded ${esc(p.name)}`);
  return d;
}

    <div class="galnote" style="color:var(--muted);font-size:13px"></div>
    <div class="gal"></div>
    <div class="acts"><button class="btn" data-close>Close</button></div>`, box => {
    box.style.width = "min(1040px,100%)";
    draw(box);
    box.querySelector(".gal-tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; galFmt = b.dataset.f; draw(box); });
    box.querySelector(".gal").addEventListener("click", async e => {
      const t = e.target.closest(".ptile"); if (!t) return;
      const p = PRESETS.find(x => x.id === t.dataset.id);
      t.classList.add("busy");
      try { await loadPreset(p); closeModal(); }
      catch (err) { t.classList.remove("busy"); toast(esc(netError(err)), 7000); }
    });
  });
}
$("#metaBtn").onclick = openGallery;

/* ================= Boot ================= */
async function boot() {
  load();
  let firstRun = false;
  if (!state.decks.length) {
    firstRun = true;
    $("#results").innerHTML = `<div class="loading"><div class="spin"></div>Loading the #1 Pauper deck from Scryfall…</div>`;
    try { await loadPreset(PRESETS.find(p => p.fmt === "pauper")); }
    catch (e) { newDeck("My deck", "standard"); renderAll(); $("#results").innerHTML = `<div class="err" style="grid-column:1/-1"><b>Couldn't load the starter deck.</b><br>${esc(netError(e))}<br><button class="btn sm" style="margin-top:8px" onclick="location.reload()">Reload</button></div>`; return; }
  }
  if (!deck()) state.current = state.decks[0].id;
  renderAll();
  $("#q").value = deck().format === "commander" ? "t:goblin" : "lightning"; doSearch();
  let seen = null; try { seen = localStorage.getItem("deckforge.meta"); } catch (e) {}
  if (firstRun || seen !== META_DATE) {
    try { localStorage.setItem("deckforge.meta", META_DATE); } catch (e) {}
    galFmt = deck().format === "pauper" ? "pauper" : "standard";
    openGallery();
  }
}
boot();
</script>
</body>
</html>
